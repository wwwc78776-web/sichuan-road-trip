'use strict';
const $=id=>document.getElementById(id), KEY='west-sichuan-journal-v1', defaults=()=>({version:1,day:0,pos:[0,0],checks:{},edits:{hotel:'山云涧·360°全视野悬崖美宿',address:'',dinner1:'理县县城',dinner2:'朴头镇',notes:''},history:[]});let state=defaults(),saving=true,moving=false,selected=-1,frame=0;
try{localStorage.setItem(KEY+'test','1');localStorage.removeItem(KEY+'test');let raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch(e){saving=false;$('storageNotice').textContent='当前环境无法自动保存进度';}

const tasks=[['13:00｜从成都新天地春天里自驾出发，前往理小路朴头镇入口。','17:00｜抵达理小路朴头镇入口，进山自驾游览。','17:00—18:40｜游览理小路精华段，打卡京台沟红石滩、雷神王瀑布沿线观景台。景点名称与具体位置待核实；不指定内部行车顺序和车程。\n18:40｜驶出理小路，前往理县县城。','19:10｜抵达理县县城，享用牦牛肉火锅晚餐，餐厅未指定。\n20:20｜晚餐结束，前往民宿。','20:50｜抵达民宿办理入住，夜间店内休息。民宿名称与准确地址待确认。'],['09:00｜起床，享用民宿早餐、收拾行李。\n10:00｜退房，前往毕棚沟游客中心。','11:00｜抵达游客中心，购票后换乘观光大巴入园，汽车停在游客中心。\n11:30—17:30｜核心游览，计划顺序：上海子 → 磐羊湖 → 燕子岩窝，原路返回游客中心。景点名称、开放情况及换乘方式待核实，出行前确认开放情况。','17:30—18:50｜在所选地点晚餐、休整。\n19:00｜启程返回成都。','22:00｜预计抵达成都，行程结束。']];
function validate(v){if(!v||v.version!==1||![0,1].includes(v.day)||!Array.isArray(v.pos)||v.pos.length!==2||!v.pos.every((p,d)=>Number.isInteger(p)&&p>=0&&p< [5,4][d])||!v.edits||!v.checks||Array.isArray(v.checks))throw Error('进度文件结构无效');let s=defaults();s.day=v.day;s.pos=[...v.pos];for(let k of Object.keys(s.edits)){if(typeof v.edits[k]!=='string'||v.edits[k].length>4000)throw Error('编辑内容无效');s.edits[k]=v.edits[k];}if(!['朴头镇','理县县城'].includes(s.edits.dinner2))throw Error('晚餐选项无效');for(let k of ['red','water','shanghai','lake','yanzi','back']){if(v.checks[k]!==undefined&&typeof v.checks[k]!=='boolean')throw Error('打卡内容无效');s.checks[k]=!!v.checks[k];}if(Array.isArray(v.history))s.history=v.history.filter(h=>h&&[0,1].includes(h.day)&&Number.isInteger(h.pos)&&h.pos>=0&&h.pos<[5,4][h.day]).slice(-100);return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){saving=false;$('storageNotice').textContent='当前环境无法自动保存进度';}}
function name(d,i){if((d===0&&i===4)||(d===1&&i===0))return state.edits.hotel||'民宿';if(d===0&&i===3)return state.edits.dinner1||'理县县城';if(d===1&&i===2)return state.edits.dinner2;return names[d][i];}
function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function geom(){let n=names[state.day].length,ys=Array.from({length:n},(_,i)=>95+i*180),points=ys.map((y,i)=>({x:i%2?265:135,y})),segments=[],lengths=[0];for(let i=1;i<n;i++){let a=points[i-1],b=points[i],mid=(a.y+b.y)/2;let ps=[a,{x:a.x,y:mid},{x:b.x,y:mid},b];let len=0;for(let j=1;j<ps.length;j++)len+=Math.hypot(ps[j].x-ps[j-1].x,ps[j].y-ps[j-1].y);segments.push(ps);lengths.push(lengths.at(-1)+len);}let path=`M${points[0].x},${points[0].y}`;segments.forEach(ps=>ps.slice(1).forEach(p=>path+=` L${p.x},${p.y}`));return {points,lengths,path,height:ys.at(-1)+125};}
function place(length){let path=$('road'),p=path.getPointAtLength(length),q=path.getPointAtLength(Math.min(path.getTotalLength(),length+2));$('car').setAttribute('transform',`translate(${p.x},${p.y})`);if(Math.abs(q.x-p.x)>.01)$('carDirection').setAttribute('transform',`scale(${q.x<p.x?-1:1},1)`);$('doneRoad').style.strokeDasharray=`${length} 10000`;}
function render(){document.querySelectorAll('[data-station]').forEach(e=>{let [d,i]=e.dataset.station.split(',').map(Number);e.textContent=name(d,i);});let d=state.day,p=state.pos[d],g=geom(),n=names[d].length;$('day0').classList.toggle('active',d===0);$('day1').classList.toggle('active',d===1);$('day0').setAttribute('aria-pressed',d===0);$('day1').setAttribute('aria-pressed',d===1);$('dayLabel').textContent=`DAY ${d+1} / ${d?'周六 · 山湖与归途':'周五 · 向山而行'}`;$('current').textContent=name(d,p);$('next').textContent=p<n-1?name(d,p+1):'今日行程完成';$('progress').value=p/(n-1)*100;$('percent').textContent=`已抵达 ${p+1} / ${n} 站 · ${Math.round(p/(n-1)*100)}%`;$('map').setAttribute('viewBox',`0 0 400 ${g.height}`);$('road').setAttribute('d',g.path);$('doneRoad').setAttribute('d',g.path);$('nodes').replaceChildren();$('dots').replaceChildren();g.points.forEach((pt,i)=>{let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.setAttribute('r',8);c.setAttribute('fill',i===p?'#d97745':i<p?'#42755a':'#b4c5a9');$('dots').append(c);let b=el('button',undefined,'nodeButton'+(i===p?' current':i<p?' completed':i===p+1?' next':'')+(selected===i?' selected':''));b.style.left=i%2?'52%':'4%';b.style.top=((pt.y+15)/g.height*100)+'%';b.append(el('strong',`${i<p?'✓':icons[d][i]} ${name(d,i)}`),el('small',times[d][i]));b.onclick=()=>detail(i);$('nodes').append(b);});place(g.lengths[p]);$('undo').disabled=moving||!state.history.length;$('go').disabled=moving;$('go').textContent=p===n-1?(d===0?'查看 Day 2':'两天一晚，旅程完成'):'出发去下一站';if(p===n-1&&d===1)$('go').disabled=true;$('status').textContent=p===n-1?'今日行程完成 · 把山里的风带回家':'已到达 · '+name(d,p);$('finish').replaceChildren();if(d===1&&p===n-1){let f=el('div',undefined,'finish');f.innerHTML='<svg viewBox="0 0 200 105" aria-hidden="true"><use href="#tesla" width="200" height="105"/></svg>';f.append(el('h2','两天一晚，旅程完成'),el('p','两个人，一辆车，一起收藏的山与湖。'));$('finish').append(f);}}
function snapshot(){state.history.push({day:state.day,pos:state.pos[state.day]});state.history=state.history.slice(-100);}
function switchDay(d){if(moving)return;state.day=d;selected=-1;save();render();}

$('go').onclick=()=>{if(moving)return;let d=state.day,p=state.pos[d];if(p===names[d].length-1){if(d===0)switchDay(1);return;}if(d===1&&p===1&&!state.checks.back){detail(1);$('status').textContent='请先完成园内游览，并勾选返回游客中心';return;}snapshot();moving=true;render();$('car').classList.add('moving');$('status').textContent='正在前往：'+name(d,p+1);let g=geom(),start=performance.now(),duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:2300;function tick(now){let t=duration?Math.min(1,(now-start)/duration):1;place(g.lengths[p]+(g.lengths[p+1]-g.lengths[p])*(t*t*(3-2*t)));if(t<1)frame=requestAnimationFrame(tick);else{state.pos[d]++;moving=false;$('car').classList.remove('moving');save();render();let node=$('nodes').children[state.pos[d]];node.scrollIntoView({behavior:duration?'smooth':'auto',block:'center'});}}frame=requestAnimationFrame(tick);};

function open(title){$('dialogTitle').textContent=title;$('content').replaceChildren();if(!$('dialog').open)$('dialog').showModal();return $('content');}$('close').onclick=()=>$('dialog').close();
function check(container,k,label){let l=el('label',undefined,'check'),c=document.createElement('input');c.type='checkbox';c.checked=!!state.checks[k];c.onchange=()=>{if(k==='back'&&c.checked&&!['shanghai','lake','yanzi'].every(x=>state.checks[x])){c.checked=false;alert('请先逐一打卡上海子、磐羊湖和燕子岩窝。');return;}state.checks[k]=c.checked;if(k!=='back'&&!c.checked)state.checks.back=false;save();if(k!=='back'&&!c.checked){let back=container.querySelector('[data-back]');if(back)back.checked=false;}};if(k==='back')c.dataset.back='1';l.append(c,el('span',label));container.append(l);}
function sub(c,d,i){if(d===0&&i===2){c.append(el('h3','理小路区域打卡'),el('p','区域内自由游览；名称与具体位置待核实。','hint'));check(c,'red','京台沟红石滩 · 待核实');check(c,'water','雷神王瀑布沿线观景台 · 待核实');}if(d===1&&i===1){c.append(el('h3','园内子路线 · 观光车 / 步行'),el('p','Model Y 停留游客中心。以下顺序为计划，换乘方式与开放情况待核实。','hint'));let sub=el('div',undefined,'subroute');sub.append(el('p','游客中心 → 上海子 → 磐羊湖 → 燕子岩窝 → 原路返回游客中心'));check(sub,'shanghai','① 观光车 / 步行 · 上海子');check(sub,'lake','② 观光车 / 步行 · 磐羊湖');check(sub,'yanzi','③ 步行 / 换乘待核实 · 燕子岩窝');check(sub,'back','④ 已结束游览，原路返回游客中心');c.append(sub);}}
function detail(i){selected=i;render();let d=state.day,c=open(name(d,i));c.append(el('p',times[d][i],'tag'));tasks[d][i].split('\n').forEach(t=>c.append(el('p',t)));c.append(el('p',d===1&&i===1?'交通：自驾至游客中心；园内观光车 / 步行':'交通：自驾（同一站内活动不另设自驾路段）','hint'));if((d===0&&i===4)||(d===1&&i===0))c.append(el('p','民宿：'+name(d,i)+' · 名称待确认'),el('p','地址：'+(state.edits.address||'待确认')));if(d===1&&i===2)c.append(el('p','已选晚餐地点：'+state.edits.dinner2+'（两处备选仅选一处）'));sub(c,d,i);let copy=el('button','复制地点名称 / 地址');copy.onclick=()=>copyText(name(d,i)+(((d===0&&i===4)||(d===1&&i===0))?' '+(state.edits.address||'地址待确认'):''));c.append(copy);let set=el('button','将此站设为当前站');set.style.margin='8px';set.disabled=moving;set.onclick=()=>{if(moving)return;if(confirm('将“'+name(d,i)+'”设为当前站？此前站点将标记完成，之后站点恢复待前往；园内打卡保持不变。')){snapshot();state.pos[d]=i;save();render();$('dialog').close();}};c.append(set);}
function field(c,k,label,multi=false){let l=el('label',label),input=document.createElement(multi?'textarea':'input');input.value=state.edits[k];input.maxLength=4000;input.oninput=()=>{state.edits[k]=input.value;save();render();};l.append(input);c.append(l);}
$('list').onclick=()=>{let c=open('行程清单 / 编辑');c.append(el('p','所有时间为计划时间。民宿名称与地址待确认；餐厅未指定。','hint'));field(c,'hotel','民宿名称（待确认）');field(c,'address','民宿准确地址（待确认）');field(c,'dinner1','Day 1 晚餐地点（理县县城，餐厅未指定）');let l=el('label','Day 2 晚餐地点（二选一）'),s=document.createElement('select');['朴头镇','理县县城'].forEach(v=>{let o=el('option',v);o.value=v;s.append(o);});s.value=state.edits.dinner2;s.onchange=()=>{state.edits.dinner2=s.value;save();render();};l.append(s);c.append(l);field(c,'notes','个人备注',true);for(let d=0;d<2;d++){c.append(el('h3',`Day ${d+1} · ${d?'周六':'周五'}`));for(let i=0;i<names[d].length;i++){let row=el('section',undefined,'task');let title=el('b',name(d,i));title.dataset.station=d+','+i;row.append(title);tasks[d][i].split('\n').forEach(t=>row.append(el('p',t)));sub(row,d,i);c.append(row);}}};
function manual(text,title='手动复制'){let c=open(title);c.append(el('p','长按下方文字，选择全选并复制。'));let ta=document.createElement('textarea');ta.value=text;ta.readOnly=true;ta.style.minHeight='220px';c.append(ta);let b=el('button','选择全部文本');b.onclick=()=>{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);};c.append(b);}
async function copyText(t){try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(t);alert('已复制');}catch(e){manual(t);}}
$('export').onclick=()=>{let text=JSON.stringify(state,null,2),c=open('导出旅行进度');c.append(el('p','保存 JSON 文件，或复制完整进度文本留存。若 iPhone 未能下载，请使用复制方式。'));let b=el('button','下载 JSON 文件');b.onclick=()=>{let url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='川西旅行进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};let cp=el('button','复制进度文本');cp.onclick=()=>copyText(text);c.append(b,cp);let ta=document.createElement('textarea');ta.value=text;ta.readOnly=true;ta.onclick=()=>ta.select();c.append(el('p','也可长按以下文本全选复制：'),ta);};
function importText(t){if(moving){alert('请等待车辆到达后再导入');return;}try{if(t.length>100000)throw Error('文件过大');let next=validate(JSON.parse(t));if(confirm('导入将替换当前进度和编辑内容，确定继续？')){state=next;selected=-1;save();render();$('dialog').close();alert('进度已恢复');}}catch(e){alert('无法导入：文件不是有效的旅行进度 JSON。');}}
$('import').onclick=()=>{if(moving)return;let c=open('导入旅行进度'),b=el('button','选择本地 JSON 文件');b.onclick=()=>$('file').click();c.append(b,el('p','也可以粘贴此前导出的完整 JSON 文本：'));let ta=document.createElement('textarea');c.append(ta);let p=el('button','从文本恢复');p.onclick=()=>importText(ta.value);c.append(p);};$('file').onchange=async e=>{let f=e.target.files[0];if(f){if(f.size>100000)alert('文件过大');else importText(await f.text());}e.target.value='';};
$('reset').onclick=()=>{if(moving)return;if(confirm('确定重置全部行程、打卡和编辑内容？此操作会清除当前保存。')){state=defaults();selected=-1;save();render();}};
render();

const offlineLabel=document.getElementById('offlineState');
document.getElementById('installInfo').onclick=()=>{const c=open('Safari 安装与离线使用');['① 使用 Safari 联网访问本网页的 HTTPS 网址。','② 等待顶部显示“离线资源已就绪”。','③ 点击 Safari 分享按钮，选择“添加到主屏幕”，如有“作为网页应用打开”，请保持开启。','④ 从主屏幕图标打开，首次仍保持联网，等待离线资源就绪，然后开启飞行模式测试重新打开。','Safari 与主屏幕应用的进度可能分开保存；迁移时请先导出进度，再在主屏幕应用里导入。','系统清理网站数据或缓存后，需要重新联网准备。重要进度请导出备份。'].forEach(t=>c.append(el('p',t)));};
async function prepareOffline(){
 if(!('serviceWorker' in navigator)||!window.isSecureContext){offlineLabel.textContent='尚未启用离线缓存';document.getElementById('installHelp').textContent='请将部署包上传到 HTTPS 网站后，通过 Safari 打开网址；直接打开本地文件无法安装离线缓存。';return;}
 try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});const ready=await navigator.serviceWorker.ready;
 const channel=new MessageChannel();let timer;const result=await new Promise((resolve,reject)=>{timer=setTimeout(()=>reject(Error('timeout')),20000);channel.port1.onmessage=e=>{clearTimeout(timer);channel.port1.close();resolve(e.data);};ready.active.postMessage({type:'VERIFY_OFFLINE'},[channel.port2]);});
 if(!result||!result.ready)throw Error('cache missing');offlineLabel.textContent='✓ 离线资源已就绪';
 }catch(e){offlineLabel.textContent='离线准备未完成';document.getElementById('installHelp').textContent='请保持联网后刷新重试。当前页面仍可使用，但尚未确认可离线重新打开。';}
}
prepareOffline();

</script></body></html>
